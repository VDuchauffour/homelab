---
name: Kubernetes Lint

on:
  push:
    branches:
      - main
    paths:
      - kubernetes/**
  pull_request:
    branches:
      - main
    paths:
      - kubernetes/**
  workflow_dispatch:

env:
  SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
  SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
  SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}
  SCW_DEFAULT_REGION: ${{ secrets.SCW_REGION }}

jobs:
  helmfile-lint:
    name: Helmfile Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Scaleway
        uses: scaleway/action-scw@v0
        with:
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_PROJECT_ID }}
          save-config: true
          export-config: true

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Setup Helmfile
        uses: helmfile/helmfile-action@v2.3.1
        with:
          helm-plugins: >
            https://github.com/aslafy-z/helm-git@v1.5.2

      - name: Lint apps
        run: |
          EXCLUDE=(
            protonmail-bridge
          )
          for dir in kubernetes/apps/*/; do
            app=$(basename "$dir")
            if [[ " ${EXCLUDE[*]} " == *" $app "* ]]; then
              echo "Skipping ${dir} (excluded)"
              continue
            fi
            if [ -f "${dir}helmfile.yaml" ]; then
              echo "Linting ${dir}..."
              helmfile -f "${dir}helmfile.yaml" lint || exit 1
            fi
          done

      - name: Lint infra
        run: |
          for dir in kubernetes/infra/*/; do
            if [ -f "${dir}helmfile.yaml" ]; then
              echo "Linting ${dir}..."
              helmfile -f "${dir}helmfile.yaml" lint || exit 1
            fi
          done

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |-
          yamllint -c .yamllint.yaml kubernetes/ || true
