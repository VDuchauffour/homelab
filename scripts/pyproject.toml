[project]
name = "homelab-scripts"
version = "0.1.0"
description = "Utility scripts for the homelab cluster"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
  "kubernetes>=32",
  "typer>=0.15",
  "pydantic>=2.10",
  "structlog>=24.4",
  "anyio>=4.8",
]

[project.scripts]
warden-seed = "warden.seed_monitors:app"
warden-delete = "warden.delete_monitors:app"
warden-compare = "warden.compare:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["warden"]
