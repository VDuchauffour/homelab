[project]
name = "homelab-scripts"
version = "0.1.0"
description = "Utility scripts for the homelab cluster"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
  "kubernetes>=32",
  "typer>=0.15",
  "pydantic>=2.10",
  "structlog>=24.4",
  "anyio>=4.8",
  "pgpy>=0.6",
]

[project.scripts]
warden-seed = "warden.seed_monitors:app"
warden-delete = "warden.delete_monitors:app"
warden-compare = "warden.compare:main"
passbolt-add-field = "passbolt.add_custom_field:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["warden", "passbolt"]

[tool.pytest.ini_options]
testpaths = ["warden/tests", "passbolt/tests"]

[tool.coverage.run]
source = ["warden", "passbolt"]
omit = [
  "warden/seed_monitors.py",
  "warden/delete_monitors.py",
  "warden/compare.py",
  "warden/tests/*",
  "passbolt/add_custom_field.py",
  "passbolt/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

[dependency-groups]
dev = [
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=7.0.0",
  "ruff>=0.15.1",
]
