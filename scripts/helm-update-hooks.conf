# Per-app update hooks for helm-update.sh
#
# Apps listed here will be scaled to 0 before helmfile apply
# and back to 1 after (with an EXIT trap for safety).
#
# Format: app:namespace:resource_type:resource_name
#   app             — directory name under kubernetes/apps/ or kubernetes/infra/
#   namespace       — Kubernetes namespace
#   resource_type   — deployment or statefulset
#   resource_name   — name of the resource to scale
#
# Multiple lines for the same app: all targets are scaled together.

# Jellyfin: iGPU (gpu.intel.com/i915) must be fully released before the new pod can claim it
jellyfin:media-center:deployment:jellyfin
