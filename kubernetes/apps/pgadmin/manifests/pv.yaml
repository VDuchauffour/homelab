---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-pgadmin-data
spec:
  storageClassName: zfs-vm-pool-pgadmin
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  local:
    path: /vm-pool/pgadmin
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - joi
