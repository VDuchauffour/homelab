---
controllers:
  main:
    containers:
      main:
        resources:
          requests:
            cpu: 50m
            memory: 50Mi
          limits:
            memory: 100Mi

ingress:
  main:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: traefik
      cert-manager.io/cluster-issuer: mkcert-ca
    className: traefik
    hosts:
      - host: filebrowser.ref+envsubst://$LOCAL_DOMAIN_NAME
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
    tls:
      - hosts:
          - filebrowser.ref+envsubst://$LOCAL_DOMAIN_NAME
        secretName: filebrowser-mkcert-tls

persistence:
  database:
    storageClass: zfs-vm-pool-dynamic
  data:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: media-library
    globalMounts:
      - path: /srv/media
        readOnly: false
  share:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: share-library
    globalMounts:
      - path: /srv/share
        readOnly: false
