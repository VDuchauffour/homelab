---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-vibe-kanban
spec:
  storageClassName: sc-vibe-kanban
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  local:
    path: ref+envsubst://$VIBE_KANBAN_PATH
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - ref+envsubst://$SINGLE_NODE_NAME
