---
env:
  HOST: 0.0.0.0
  PORT: '3000'
replicaCount: 1

image:
  repository: tei1988/vibe-kanban
  pullPolicy: IfNotPresent
  tag: 0.0.127

persistence:
  enabled: true
  storageClass: sc-vibe-kanban
  accessMode: ReadWriteOnce
  size: 5Gi

resources:
  requests:
    cpu: 10m
    memory: 128Mi
  limits:
    memory: 256Mi

ingress:
  enabled: true
  className: traefik
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: mkcert-ca
  hosts:
    - host: vibe-kanban.ref+envsubst://$LOCAL_DOMAIN_NAME
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - vibe-kanban.ref+envsubst://$LOCAL_DOMAIN_NAME
      secretName: vibe-kanban-mkcert-tls
