---
replicaCount: 1

image:
  repository: ghcr.io/projecthelena/warden
  pullPolicy: IfNotPresent
  tag: v0.2.2

config:
  listenAddr: :9090
  cookieSecure: true
  trustProxy: true

database:
  type: postgres
  external:
    enabled: true
    existingSecret: warden-db-url
    existingSecretKey: db-url

ingress:
  enabled: true
  className: traefik
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: mkcert-ca
  hosts:
    - host: warden.ref+envsubst://$LOCAL_DOMAIN_NAME
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - warden.ref+envsubst://$LOCAL_DOMAIN_NAME
      secretName: warden-mkcert-tls

resources:
  requests:
    cpu: 10m
    memory: 24Mi
  limits:
    memory: 64Mi
