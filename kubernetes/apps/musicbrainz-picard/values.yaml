---
ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: mkcert-ca
  hosts:
    - host: musicbrainz-picard.ref+envsubst://$LOCAL_DOMAIN_NAME
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - musicbrainz-picard.ref+envsubst://$LOCAL_DOMAIN_NAME
      secretName: musicbrainz-picard-mkcert-tls

persistence:
  config:
    size: 1Gi
