---
repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami

releases:
  - name: tracearr-redis
    namespace: tracearr
    createNamespace: true
    chart: bitnami/redis
    version: 25.3.12
    values:
      - values-redis.yaml

  - name: tracearr
    namespace: tracearr
    createNamespace: true
    chart: ./charts/tracearr
    needs:
      - tracearr/tracearr-redis
    values:
      - values.yaml
