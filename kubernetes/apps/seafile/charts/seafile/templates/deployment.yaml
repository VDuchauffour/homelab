apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "seafile.fullname" . }}
  labels:
    {{- include "seafile.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "seafile.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "seafile.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: DB_HOST
              value: {{ .Values.database.host | quote }}
            - name: DB_PORT
              value: {{ .Values.database.port | quote }}
            - name: DB_ROOT_PASSWD
              value: {{ .Values.database.rootPassword | quote }}
            - name: TIME_ZONE
              value: {{ .Values.seafile.timeZone | quote }}
            - name: SEAFILE_ADMIN_EMAIL
              value: {{ .Values.seafile.adminEmail | quote }}
            - name: SEAFILE_ADMIN_PASSWORD
              value: {{ .Values.seafile.adminPassword | quote }}
            - name: SEAFILE_SERVER_LETSENCRYPT
              value: "false"
            - name: SEAFILE_SERVER_HOSTNAME
              value: {{ .Values.seafile.serverHostname | quote }}
            {{- if .Values.seafile.forceHttpsInConf }}
            - name: FORCE_HTTPS_IN_CONF
              value: "true"
            {{- end }}
            - name: MEMCACHED_HOST
              value: {{ .Values.memcached.host | quote }}
            - name: MEMCACHED_PORT
              value: {{ .Values.memcached.port | quote }}
          volumeMounts:
            - name: shared
              mountPath: /shared
            {{- if .Values.persistence.data.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.data.mountPath }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: {{ include "seafile.fullname" . }}-shared
        {{- if .Values.persistence.data.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.data.existingClaim | default (printf "%s-data" (include "seafile.fullname" .)) }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
