---
env:
  TZ: Europe/Paris

securityContext:
  runAsUser: 0
  runAsGroup: 0

initContainers:
  download-card-mod:
    image: curlimages/curl:8.12.1
    securityContext:
      runAsUser: 0
      runAsGroup: 0
    command:
      - sh
      - -c
      - |
        mkdir -p /config/www
        curl -fsSL -o /config/www/card-mod.js \
          "https://raw.githubusercontent.com/thomasloven/lovelace-card-mod/v4.2.1/card-mod.js"
    volumeMounts:
      - name: config
        mountPath: /config
  download-heatzy:
    image: curlimages/curl:8.12.1
    securityContext:
      runAsUser: 0
      runAsGroup: 0
    command:
      - sh
      - -c
      - |
        set -e
        VERSION=6.4.9
        DEST=/config/custom_components/heatzy
        if [ ! -f "$DEST/manifest.json" ] || ! grep -q "\"version\": \"$VERSION\"" "$DEST/manifest.json"; then
          echo "Installing hass-heatzy $VERSION"
          mkdir -p /config/custom_components
          rm -rf "$DEST"
          cd /tmp
          curl -fsSL -o heatzy.tar.gz \
            "https://github.com/Cyr-ius/hass-heatzy/archive/refs/tags/${VERSION}.tar.gz"
          tar -xzf heatzy.tar.gz
          mv "hass-heatzy-${VERSION}/custom_components/heatzy" "$DEST"
          rm -rf "hass-heatzy-${VERSION}" heatzy.tar.gz
          echo "Installed: $(cat $DEST/manifest.json | grep version)"
        else
          echo "hass-heatzy $VERSION already installed, skipping"
        fi
    volumeMounts:
      - name: config
        mountPath: /config

persistence:
  config:
    enabled: true
    type: pvc
    mountPath: /config
    readOnly: false
    storageClass: zfs-vm-pool-dynamic
    size: 5Gi
  ha-config-yaml:
    enabled: true
    type: configMap
    name: home-assistant-config
    mountPath: /config/configuration.yaml
    subPath: configuration.yaml
    readOnly: true
  ha-themes:
    enabled: true
    type: configMap
    name: home-assistant-themes
    mountPath: /config/themes/soft-ui.yaml
    subPath: soft-ui.yaml
    readOnly: true

metrics:
  enabled: true
  serviceMonitor:
    interval: 1m
    scrapeTimeout: 30s
    bearerTokenSecret:
      name: home-assistant-prometheus-token
      key: token

resources:
  requests:
    cpu: 10m
    memory: 256Mi
  limits:
    memory: 1Gi

ingress:
  main:
    enabled: true
    primary: true
    annotations:
      kubernetes.io/ingress.class: traefik
      cert-manager.io/cluster-issuer: mkcert-ca
    labels: {}
    ingressClassName: traefik
    hosts:
      - host: home-assistant.ref+envsubst://$LOCAL_DOMAIN_NAME
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - home-assistant.ref+envsubst://$LOCAL_DOMAIN_NAME
        secretName: home-assistant-mkcert-tls
