---
replicaCount: 1

image:
  repository: ghcr.io/kanbn/kan
  pullPolicy: IfNotPresent
  tag: latest
domainName: '{{ .Values.domainName }}'

kan:
  baseUrl: https://kan.home.arpa
  authSecret: ref+passbolt://92595b76-c01e-44f2-a47c-3e1508074331#/custom_fields/AUTHSECRET
  allowCredentials: true

postgres:
  host: cnpg-cluster0-rw.cnpg-clusters.svc.cluster.local
  port: 5432
  database: kan
  user: kan
  password: ref+passbolt://92595b76-c01e-44f2-a47c-3e1508074331#/custom_fields/CNPG_PASSWORD

ingress:
  enabled: true
  className: traefik
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: mkcert-ca
  hosts:
    - host: kan.home.arpa
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - kan.home.arpa
      secretName: kan-mkcert-tls
