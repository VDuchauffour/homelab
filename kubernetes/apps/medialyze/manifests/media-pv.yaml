---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-media-library-medialyze
spec:
  storageClassName: nfs-media-library
  capacity:
    storage: 2Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - nfsvers=4
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: nfs-media-library-medialyze
    volumeAttributes:
      server: nfs-server-media.nfs-server-media.svc.cluster.local
      share: /
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-library
  namespace: medialyze
spec:
  storageClassName: nfs-media-library
  volumeName: pv-media-library-medialyze
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Ti
