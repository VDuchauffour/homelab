apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "autoscan.fullname" . }}
  labels:
    {{- include "autoscan.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "autoscan.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "autoscan.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.autoscan }}
      initContainers:
        - name: copy-config
          image: busybox:stable
          command: ['sh', '-c', 'cp /config-template/config.json /config/config.json']
          volumeMounts:
            - name: data
              mountPath: /config
            - name: config-file
              mountPath: /config-template
              readOnly: true
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3468
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "autoscan.fullname" . }}-config
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /config
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "autoscan.fullname" . }}
        {{- end }}
        {{- if .Values.autoscan }}
        - name: config-file
          secret:
            secretName: {{ include "autoscan.fullname" . }}-config-json
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
