---
env:
  - name: TZ
    value: Europe/Paris

persistence:
  enabled: true
  storageClass: zfs-vm-pool-dynamic
  size: 1Gi

resources:
  requests:
    cpu: 10m
    memory: 384Mi
  limits:
    memory: 768Mi

ingress:
  enabled: true
  className: traefik
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: mkcert-ca
  hosts:
    - host: jellyseerr.ref+envsubst://$LOCAL_DOMAIN_NAME
      paths:
        - path: /
          pathType: Prefix
  tls:
    - host:
        - jellyseerr.ref+envsubst://$LOCAL_DOMAIN_NAME
      secretName: jellyseerr-mkcert-tls
