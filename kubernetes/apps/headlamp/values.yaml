---
config:
  watchPlugins: true
pluginsManager:
  enabled: true
  configContent: |
    plugins:
      - name: cert-manager
        source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_cert-manager
        version: 0.1.0
      - name: knative
        source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_knative
        version: 0.1.0-alpha
      - name: fluxcd
        source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_flux
        version: 0.5.0
      - name: opencost
        source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_opencost
        version: 0.1.3
      - name: ai-assistant
        source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_ai_assistant
        version: 0.1.0-alpha
    installOptions:
      parallel: true
      maxConcurrent: 2
  baseImage: node:lts-alpine
  version: latest
resources:
  requests:
    cpu: 10m
    memory: 96Mi
  limits:
    memory: 192Mi
serviceAccount:
  create: true
  annotations: {}
  name: headlamp-admin
ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: mkcert-ca
  hosts:
    - host: headlamp.ref+envsubst://$LOCAL_DOMAIN_NAME
      paths:
        - path: /
          type: Prefix
  tls:
    - hosts:
        - headlamp.ref+envsubst://$LOCAL_DOMAIN_NAME
      secretName: headlamp-mkcert-tls
