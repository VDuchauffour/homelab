---
image:
  repository: corentinth/it-tools
  pullPolicy: IfNotPresent
  tag: latest

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 5m
    memory: 16Mi
  limits:
    memory: 128Mi

ingress:
  enabled: true
  className: traefik
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: mkcert-ca
  hosts:
    - host: it-tools.ref+envsubst://$LOCAL_DOMAIN_NAME
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - it-tools.ref+envsubst://$LOCAL_DOMAIN_NAME
      secretName: it-tools-mkcert-tls
