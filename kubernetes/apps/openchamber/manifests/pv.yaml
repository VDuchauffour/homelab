---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-openchamber-workdir
spec:
  storageClassName: sc-openchamber-workdir
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  local:
    path: ref+envsubst://$HOME_DIR/projects
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - ref+envsubst://$SINGLE_NODE_NAME
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-openchamber-worktree
spec:
  storageClassName: sc-openchamber-worktree
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  local:
    path: ref+envsubst://$HOME_DIR/worktrees
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - ref+envsubst://$SINGLE_NODE_NAME
