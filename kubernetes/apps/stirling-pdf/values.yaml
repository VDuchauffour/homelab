---
nameOverride: stirling-pdf
resources:
  requests:
    cpu: 20m
    memory: 512Mi
  limits:
    cpu: '2'
    memory: 1536Mi
ingressClassName: traefik
ingress:
  enabled: true
  pathType: Prefix
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: mkcert-ca
  hosts:
    - name: stirling-pdf.ref+envsubst://$LOCAL_DOMAIN_NAME
      path: /
      tls: false
    - name: stirling-pdf.ref+envsubst://$LOCAL_DOMAIN_NAME
      path: /
      tls: true
      tlsSecret: stirling-pdf-mkcert-tls
