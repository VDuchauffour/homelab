---
image:
  repository: n8nio/n8n
  pullPolicy: IfNotPresent
  tag: 2.10.2
main:
  secret:
    n8n:
      encryption_key: ref+scw:///homelab/n8n#/encryption-key
  config:
    db:
      type: postgresdb
      postgresdb:
        host: cnpg-cluster0-rw.cnpg-clusters.svc.cluster.local
        database: n8n
        user: n8n
  extraEnv:
    DB_POSTGRESDB_PASSWORD:
      valueFrom:
        secretKeyRef:
          name: n8n-cnpg-credentials
          key: password
  persistence:
    enabled: true
    type: dynamic
    readOnly: false
    storageClass: zfs-configs-clusters-k3s-dynamic
    accessMode: ReadWriteOnce
    size: 2Gi

resources:
  requests:
    cpu: 10m
    memory: 320Mi
  limits:
    memory: 768Mi

ingress:
  enabled: true
  className: traefik
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: mkcert-ca
  hosts:
    - host: n8n.ref+envsubst://$LOCAL_DOMAIN_NAME
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - n8n.ref+envsubst://$LOCAL_DOMAIN_NAME
      secretName: n8n-mkcert-tls
