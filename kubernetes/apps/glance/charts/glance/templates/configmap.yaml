apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "glance.fullname" . }}-config
  labels:
    {{- include "glance.labels" . | nindent 4 }}
data:
  glance.yml: |
    server:
      port: 8080
      proxied: true

    theme:
      background-color: 240 8 9
      primary-color: 43 50 70
      contrast-multiplier: 1.3

    auth:
      secret-key: {{ .Values.glance.auth.secretKey }}
      users:
        admin:
          password: {{ .Values.glance.auth.users.admin.password }}

    pages:
    {{- range .Values.glance.pages }}
    {{- $pageDomain := .domain }}
    {{- if eq $pageDomain "PUBLIC_DOMAIN_NAME" }}
    {{- $pageDomain = $.Values.domainName }}
    {{- else if eq $pageDomain "LOCAL_DOMAIN" }}
    {{- $pageDomain = $.Values.localDomain }}
    {{- end }}
      - name: {{ .name }}
        columns:
          {{- if eq .name "Public" }}
          - size: small
            widgets:
              - type: bookmarks
                hide-header: true
                groups:
                {{- range $.Values.glance.publicOnlyBookmarkGroups }}
                  - title: {{ .title }}
                    links:
                    {{- range .links }}
                      - title: {{ .title }}
                        url: https://{{ .subdomain }}.{{ $pageDomain }}
                        icon: {{ .icon }}
                    {{- end }}
                {{- end }}
          - size: full
            widgets:
              - type: bookmarks
                hide-header: true
                groups:
                {{- range $.Values.glance.commonBookmarkGroups }}
                  - title: {{ .title }}
                    links:
                    {{- range .links }}
                      - title: {{ .title }}
                        url: https://{{ .subdomain }}.{{ $pageDomain }}
                        icon: {{ .icon }}
                    {{- end }}
                {{- end }}
          {{- else if eq .name "Local" }}
          - size: small
            widgets:
              - type: bookmarks
                hide-header: true
                groups:
                {{- range $.Values.glance.localOnlyBookmarkGroups }}
                  - title: {{ .title }}
                    links:
                    {{- range .links }}
                      - title: {{ .title }}
                        url: https://{{ .subdomain }}.{{ $pageDomain }}
                        icon: {{ .icon }}
                    {{- end }}
                {{- end }}
          - size: full
            widgets:
              - type: bookmarks
                hide-header: true
                groups:
                {{- range $.Values.glance.commonBookmarkGroups }}
                  - title: {{ .title }}
                    links:
                    {{- range .links }}
                      - title: {{ .title }}
                        url: https://{{ .subdomain }}.{{ $pageDomain }}
                        icon: {{ .icon }}
                    {{- end }}
                {{- end }}
          {{- else if eq .name "Stats" }}
          - size: small
            widgets:
              - type: calendar
                first-day-of-week: {{ $.Values.glance.sharedWidgets.stats | first | dig "firstDayOfWeek" "monday" }}
              - type: weather
                location: {{ (index $.Values.glance.sharedWidgets.stats 1).location }}
                units: {{ (index $.Values.glance.sharedWidgets.stats 1).units }}
                hour-format: {{ (index $.Values.glance.sharedWidgets.stats 1).hourFormat }}
              - type: to-do

          - size: full
            widgets:
              - type: hacker-news
                limit: {{ (index $.Values.glance.sharedWidgets.stats 3).limit }}
                collapse-after: {{ (index $.Values.glance.sharedWidgets.stats 3).collapseAfter }}

          - size: small
            widgets:
              - type: server-stats
                servers:
                  - type: local
                    name: Services
              - type: custom-api
                title: Gluetun status
                cache: 1m
                url: http://{{ $.Values.gluetunUrl }}/v1/publicip/ip
                headers:
                  X-API-Key: {{ $.Values.gluetunApiKey }}
                template: |
                  {{`{{ if eq .Response.StatusCode 200 }}`}}
                    {{`{{ $ip := (.JSON.String "public_ip") }}`}}
                    {{`{{ $city := (.JSON.String "city") }}`}}
                    {{`{{ $country := (.JSON.String "country") }}`}}
                    {{`{{ if eq $ip "" }}`}}
                      <div>
                        <div>
                          <div>
                            <div class="color-highlight size-h3">
                              Your VPN is not connected!
                              <span class="color-negative">●</span>
                            </div>
                          </div>
                        </div>
                      </div>
                    {{`{{ else }}`}}
                      <div>
                        <div>
                          <div>
                            <div class="color-highlight size-h3">
                              Your VPN is connected!
                              <span class="color-positive">●</span>
                            </div>
                          </div>
                          <div class="size-h5">{{`{{ $ip }}`}} - {{`{{ $city }}`}}, {{`{{ $country }}`}}</div>
                        </div>
                      </div>
                    {{`{{ end }}`}}
                  {{`{{ else }}`}}
                    <div style="text-align: center; color: var(--color-negative);">
                      Error: {{`{{ .Response.StatusCode }}`}} - {{`{{ .Response.Status }}`}}
                    </div>
                  {{`{{ end }}`}}
              - type: custom-api
                title: qBittorrent
                cache: 10s
                options:
                  view: "detailed"
                  mode: "default"
                subrequests:
                  transfer:
                    url: http://{{ $.Values.qbittorrentUrl }}/api/v2/transfer/info
                  seeding:
                    url: http://{{ $.Values.qbittorrentUrl }}/api/v2/torrents/info
                    parameters:
                      filter: seeding
                  leeching:
                    url: http://{{ $.Values.qbittorrentUrl }}/api/v2/torrents/info
                    parameters:
                      filter: downloading
                template: |
                  {{`{{ $transfer := .Subrequest "transfer" }}`}}
                  {{`{{ $seeding := .Subrequest "seeding" }}`}}
                  {{`{{ $leeching := .Subrequest "leeching" }}`}}

                  {{`{{ if and (eq $transfer.Response.StatusCode 200) (eq $seeding.Response.StatusCode 200) (eq $leeching.Response.StatusCode 200) }}`}}

                    {{`{{ $isDetailed := eq (.Options.StringOr "view" "detailed") "detailed" }}`}}
                    {{`{{ $mode := .Options.StringOr "mode" "default" }}`}}

                    {{`{{ if $isDetailed }}`}}
                    <!-- Detailed View -->
                    <div class="list" style="--list-gap: 15px;">
                      <div class="flex justify-between text-center">
                        <div>
                          {{`{{ $dlSpeed := $transfer.JSON.Float "dl_info_speed" }}`}}
                          {{`{{ if eq $mode "upload" }}`}}
                            <div class="color-highlight size-h3">{{`{{ printf "%.1f MB/s" (div $dlSpeed 1000000.0) }}`}}</div>
                          {{`{{ else }}`}}
                            {{`{{ if lt $dlSpeed 1048576.0 }}`}}
                              <div class="color-highlight size-h3">{{`{{ printf "%.0f KiB/s" (div $dlSpeed 1024.0) }}`}}</div>
                            {{`{{ else }}`}}
                              <div class="color-highlight size-h3">{{`{{ printf "%.1f MiB/s" (div $dlSpeed 1048576.0) }}`}}</div>
                            {{`{{ end }}`}}
                          {{`{{ end }}`}}
                          <div class="size-h6">DOWNLOADING</div>
                        </div>

                        {{`{{ if eq $mode "upload" }}`}}
                        <div>
                          {{`{{ $ulSpeed := $transfer.JSON.Float "up_info_speed" }}`}}
                          <div class="color-highlight size-h3">{{`{{ printf "%.1f MB/s" (div $ulSpeed 1000000.0) }}`}}</div>
                          <div class="size-h6">UPLOADING</div>
                        </div>
                        {{`{{ end }}`}}

                        <div>
                          <div class="color-highlight size-h3">{{`{{ len ($seeding.JSON.Array "") }}`}}</div>
                          <div class="size-h6">SEEDING</div>
                        </div>

                        {{`{{ if eq $mode "default" }}`}}
                        <div>
                          <div class="color-highlight size-h3">{{`{{ len ($leeching.JSON.Array "") }}`}}</div>
                          <div class="size-h6">LEECHING</div>
                        </div>
                        {{`{{ end }}`}}
                      </div>

                      <!-- Downloading list -->
                      {{`{{ $downloadingTorrents := $leeching.JSON.Array "" }}`}}
                      {{`{{ if gt (len $downloadingTorrents) 0 }}`}}
                        <div style="margin-top: 15px;">
                          <ul class="list collapsible-container" data-collapse-after="0" style="--list-gap: 15px;">
                            {{`{{ range $t := $downloadingTorrents }}`}}
                              {{`{{ $state := $t.String "state" }}`}}
                              {{`{{ $icon := "?" }}`}}
                              {{`{{ if ge ($t.Int "completed") ($t.Int "size") }}{{ $icon = "✔" }}`}}
                              {{`{{ else if eq $state "downloading" "forcedDL" }}{{ $icon = "↓" }}`}}
                              {{`{{ else if eq $state "pausedDL" "stoppedDL" "pausedUP" "stalledDL" "stalledUP" "queuedDL" "queuedUP" }}{{ $icon = "❚❚" }}`}}
                              {{`{{ else if eq $state "error" "missingFiles" }}{{ $icon = "!" }}`}}
                              {{`{{ else if eq $state "checkingDL" "checkingUP" "allocating" }}{{ $icon = "…" }}`}}
                              {{`{{ else if eq $state "checkingResumeData" }}{{ $icon = "⟳" }}`}}
                              {{`{{ end }}`}}

                              <li class="flex items-center" style="gap: 10px;">
                                <div class="size-h4" style="flex-shrink: 0;">{{`{{ $icon }}`}}</div>
                                <div style="flex-grow: 1; min-width: 0;">
                                  <div class="text-truncate color-highlight">{{`{{ $t.String "name" }}`}}</div>
                                  <div title="{{`{{ $t.Float "progress" | mul 100 | printf "%.1f" }}`}}%" style="background: rgba(128, 128, 128, 0.2); border-radius: 5px; height: 6px; margin-top: 5px; overflow: hidden;">
                                    <div style="width: {{`{{ $t.Float "progress" | mul 100 }}`}}%; background-color: var(--color-positive); height: 100%; border-radius: 5px;"></div>
                                  </div>
                                </div>
                                <div style="flex-shrink: 0; text-align: right; width: 80px;">
                                  {{`{{ $dlSpeed := $t.Float "dlspeed" }}`}}
                                  <div class="size-sm color-paragraph">
                                    {{`{{ if eq $mode "upload" }}`}}
                                      {{`{{ if lt $dlSpeed 1000.0 }}`}}--{{`{{ else }}{{ printf "%.1f MB/s" (div $dlSpeed 1000000.0) }}{{ end }}`}}
                                    {{`{{ else }}`}}
                                      {{`{{ if lt $dlSpeed 1024.0 }}`}}--{{`{{ else if lt $dlSpeed 1048576.0 }}{{ printf "%.0f KiB/s" (div $dlSpeed 1024.0) }}{{ else }}{{ printf "%.1f MiB/s" (div $dlSpeed 1048576.0) }}{{ end }}`}}
                                    {{`{{ end }}`}}
                                  </div>
                                  {{`{{ $eta := $t.Int "eta" }}`}}
                                  <div class="size-sm color-paragraph">
                                    {{`{{ if eq $eta 8640000 }}`}}∞
                                    {{`{{ else if gt $eta 3600 }}{{ printf "%dh %dm" (div $eta 3600) (mod (div $eta 60) 60) }}`}}
                                    {{`{{ else if gt $eta 0 }}{{ printf "%dm" (div $eta 60) }}`}}
                                    {{`{{ else }}`}}--{{`{{ end }}`}}
                                  </div>
                                </div>
                              </li>
                            {{`{{ end }}`}}
                          </ul>
                        </div>
                      {{`{{ end }}`}}

                      <!-- Seeding list -->
                      {{`{{ if eq $mode "upload" }}`}}
                        {{`{{ $seedingTorrents := $seeding.JSON.Array "" }}`}}
                        {{`{{ if gt (len $seedingTorrents) 0 }}`}}
                          <div style="margin-top: 20px;">
                            <ul class="list collapsible-container" data-collapse-after="0" style="--list-gap: 15px;">
                              {{`{{ range $t := $seedingTorrents }}`}}
                                {{`{{ $state := $t.String "state" }}`}}
                                {{`{{ $icon := "↑" }}`}}
                                {{`{{ if eq $state "pausedUP" "stoppedUP" "stalledUP" "queuedUP" }}{{ $icon = "❚❚" }}`}}
                                {{`{{ else if eq $state "error" "missingFiles" }}{{ $icon = "!" }}`}}
                                {{`{{ else if eq $state "checkingUP" }}{{ $icon = "…" }}`}}
                                {{`{{ else if eq $state "checkingResumeData" }}{{ $icon = "⟳" }}`}}
                                {{`{{ end }}`}}

                                <li class="flex items-center" style="gap: 10px;">
                                  <div class="size-h4" style="flex-shrink: 0;">{{`{{ $icon }}`}}</div>
                                  <div style="flex-grow: 1; min-width: 0;">
                                    <div class="text-truncate color-highlight">{{`{{ $t.String "name" }}`}}</div>
                                    <div class="size-sm color-paragraph">
                                      Ratio: {{`{{ printf "%.2f" ($t.Float "ratio") }}`}} |
                                      Size: {{`{{ printf "%.1f GB" (div ($t.Float "size") 1073741824.0) }}`}}
                                    </div>
                                  </div>
                                  <div style="flex-shrink: 0; text-align: right; width: 80px;">
                                    {{`{{ $ulSpeed := $t.Float "upspeed" }}`}}
                                    <div class="size-sm color-paragraph">
                                      {{`{{ if lt $ulSpeed 1000.0 }}`}}--{{`{{ else }}{{ printf "%.1f MB/s" (div $ulSpeed 1000000.0) }}{{ end }}`}}
                                    </div>
                                    <div class="size-sm color-paragraph">Upload</div>
                                  </div>
                                </li>
                              {{`{{ end }}`}}
                            </ul>
                          </div>
                        {{`{{ end }}`}}
                      {{`{{ end }}`}}

                    </div>

                    {{`{{ else }}`}}
                    <!-- Basic View -->
                    <div class="flex justify-between text-center">
                      <div>
                        {{`{{ $dlSpeed := $transfer.JSON.Float "dl_info_speed" }}`}}
                        <div class="color-highlight size-h3">{{`{{ printf "%.1f MB/s" (div $dlSpeed 1000000.0) }}`}}</div>
                        <div class="size-h6">DOWNLOADING</div>
                      </div>
                      {{`{{ if eq $mode "upload" }}`}}
                      <div>
                        {{`{{ $ulSpeed := $transfer.JSON.Float "up_info_speed" }}`}}
                        <div class="color-highlight size-h3">{{`{{ printf "%.1f MB/s" (div $ulSpeed 1000000.0) }}`}}</div>
                        <div class="size-h6">UPLOADING</div>
                      </div>
                      {{`{{ end }}`}}
                      <div>
                        <div class="color-highlight size-h3">{{`{{ len ($seeding.JSON.Array "") }}`}}</div>
                        <div class="size-h6">SEEDING</div>
                      </div>
                      {{`{{ if eq $mode "default" }}`}}
                      <div>
                        <div class="color-highlight size-h3">{{`{{ len ($leeching.JSON.Array "") }}`}}</div>
                        <div class="size-h6">LEECHING</div>
                      </div>
                      {{`{{ end }}`}}
                    </div>
                    {{`{{ end }}`}}

                   {{`{{ else }}`}}
                    <div class="color-negative text-center">
                      <p>Error fetching qBittorrent data.</p>
                      <p class="size-sm">Check URL and authentication bypass settings.</p>
                    </div>
                  {{`{{ end }}`}}
          {{- else if eq .name "Status" }}
          - size: full
            widgets:
              - type: custom-api
                hide-header: true
                url: http://{{ $.Values.wardenUrl }}/api/uptime
                headers:
                  Authorization: Bearer {{ $.Values.wardenApiKey }}
                cache: 30s
                template: |
                  {{`{{ if eq .Response.StatusCode 200 }}`}}
                    {{`{{ $groups := .JSON.Array "groups" }}`}}
                    {{`{{ if gt (len $groups) 0 }}`}}
                      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px;">
                        {{`{{ range $groups }}`}}
                          {{`{{ $monitors := .Array "monitors" }}`}}
                          {{`{{ if gt (len $monitors) 0 }}`}}
                            {{`{{ range $monitors }}`}}
                              {{`{{ $status := .String "status" }}`}}
                              {{`{{ $latency := .Int "latency" }}`}}
                              {{`{{ $name := .String "name" }}`}}
                              <div style="padding: 24px; background: rgba(128, 128, 128, 0.05); border-radius: 12px; text-align: center; min-height: 160px; display: flex; flex-direction: column; justify-content: space-between;">
                                <div style="display: flex; justify-content: center; margin-bottom: 16px;">
                                  {{`{{ if eq $status "up" }}`}}
                                    <svg style="width: 48px; height: 48px;" fill="var(--color-positive)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                                      <path fill-rule="evenodd" d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm3.857-9.809a.75.75 0 0 0-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 1 0-1.06 1.061l2.5 2.5a.75.75 0 0 0 1.137-.089l4-5.5Z" clip-rule="evenodd"></path>
                                    </svg>
                                  {{`{{ else if eq $status "degraded" }}`}}
                                    <svg style="width: 48px; height: 48px;" fill="var(--color-warning)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                                      <path fill-rule="evenodd" d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.17 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495ZM10 5a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 10 5Zm0 9a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd"></path>
                                    </svg>
                                  {{`{{ else if eq $status "paused" }}`}}
                                    <svg style="width: 48px; height: 48px;" fill="var(--color-subdue)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                                      <path d="M5.75 3a.75.75 0 0 0-.75.75v12.5c0 .414.336.75.75.75h1.5a.75.75 0 0 0 .75-.75V3.75A.75.75 0 0 0 7.25 3h-1.5ZM12.75 3a.75.75 0 0 0-.75.75v12.5c0 .414.336.75.75.75h1.5a.75.75 0 0 0 .75-.75V3.75a.75.75 0 0 0-.75-.75h-1.5Z"></path>
                                    </svg>
                                  {{`{{ else }}`}}
                                    <svg style="width: 48px; height: 48px;" fill="var(--color-negative)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                                      <path fill-rule="evenodd" d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16ZM8.28 7.22a.75.75 0 0 0-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 1 0 1.06 1.06L10 11.06l1.72 1.72a.75.75 0 1 0 1.06-1.06L11.06 10l1.72-1.72a.75.75 0 0 0-1.06-1.06L10 8.94 8.28 7.22Z" clip-rule="evenodd"></path>
                                    </svg>
                                  {{`{{ end }}`}}
                                </div>
                                <div class="size-h3 color-highlight" style="word-break: break-word; margin-bottom: 8px;">{{`{{ $name }}`}}</div>
                                {{`{{ if and (ne $status "paused") (gt $latency 0) }}`}}
                                  <div class="size-h4 color-subdue">{{`{{ $latency }}`}}ms</div>
                                {{`{{ else if eq $status "paused" }}`}}
                                  <div class="size-h4 color-subdue">Paused</div>
                                {{`{{ else }}`}}
                                  <div class="size-h4 color-subdue">-</div>
                                {{`{{ end }}`}}
                              </div>
                            {{`{{ end }}`}}
                          {{`{{ end }}`}}
                        {{`{{ end }}`}}
                      </div>
                    {{`{{ else }}`}}
                      <div class="text-center" style="padding: 40px;">
                        <p class="size-h5 color-subdue">No monitors</p>
                      </div>
                    {{`{{ end }}`}}
                  {{`{{ else }}`}}
                    <div class="color-negative text-center" style="padding: 20px;">
                      <p class="size-h6">Failed to fetch data</p>
                    </div>
                  {{`{{ end }}`}}
          {{- end }}
    {{- end }}
