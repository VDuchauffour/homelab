---
replicaCount: 1

gluetunUrl: ''
gluetunApiKey: ''
qbittorrentUrl: ''
wardenUrl: warden.warden.svc.cluster.local:9090
wardenApiKey: ref+envsubst://$WARDEN_API_KEY
domainName: '{{ .Values.domainName }}'
localDomain: ref+envsubst://$LOCAL_DOMAIN_NAME

image:
  repository: glanceapp/glance
  pullPolicy: IfNotPresent
  tag: latest

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: mkcert-ca
  hosts:
    - host: dashboard.ref+envsubst://$LOCAL_DOMAIN_NAME
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - dashboard.ref+envsubst://$LOCAL_DOMAIN_NAME
      secretName: glance-mkcert-tls

persistence:
  enabled: false
resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

env:
  TZ: Europe/Paris

glance:
  pages:
    - name: Public
      domain: PUBLIC_DOMAIN_NAME
    - name: Local
      domain: LOCAL_DOMAIN
    - name: Stats
      domain: LOCAL_DOMAIN
    - name: Status
      domain: LOCAL_DOMAIN

  commonBookmarkGroups:
    - title: Productivity
      links:
        - title: Kan.sh
          subdomain: kan
          icon: https://raw.githubusercontent.com/kanbn/kan/refs/heads/main/apps/docs/favicon.png
        - title: Stirling PDF
          subdomain: stirling-pdf
          icon: sh:stirling-pdf
        - title: Linkwarden
          subdomain: linkwarden
          icon: sh:linkwarden
        - title: Linkding
          subdomain: linkding
          icon: sh:linkding
        - title: Memos
          subdomain: memos
          icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/memos.png

    - title: Sharing
      links:
        - title: Privatebin
          subdomain: privatebin
          icon: di:privatebin

    - title: Media
      links:
        - title: Jellyfin
          subdomain: jellyfin
          icon: di:jellyfin
        - title: Jellyseerr
          subdomain: jellyseerr
          icon: di:jellyseerr
        - title: Immich
          subdomain: immich
          icon: di:immich
        - title: qBittorrent
          subdomain: qbittorrent
          icon: di:qbittorrent

    - title: Arr
      links:
        - title: Bazarr
          subdomain: bazarr
          icon: di:bazarr
        - title: Radarr
          subdomain: radarr
          icon: di:radarr
        - title: Sonarr
          subdomain: sonarr
          icon: di:sonarr
        - title: Lidarr
          subdomain: lidarr
          icon: di:lidarr
        - title: Prowlarr
          subdomain: prowlarr
          icon: di:prowlarr
        - title: Tdarr
          subdomain: tdarr
          icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/tdarr.png

    - title: AI
      links:
        - title: n8n
          subdomain: n8n
          icon: di:n8n
        - title: OpenChamber
          subdomain: openchamber
          icon: https://raw.githubusercontent.com/btriapitsyn/openchamber/20f158f2b71b66aef0235531b5092ba82cda720f/packages/vscode/assets/app-icon.png
        - title: OpenCode
          subdomain: opencode
          icon: di:opencode

  localOnlyBookmarkGroups:
    - title: Cluster
      links:
        - title: Headlamp
          subdomain: headlamp
          icon: di:headlamp
        - title: Helm Dashboard
          subdomain: helm-dashboard
          icon: di:helm
        - title: Passbolt
          subdomain: passbolt
          icon: di:passbolt
        - title: pgAdmin
          subdomain: pgadmin
          icon: di:postgresql
        - title: MinIO
          subdomain: minio-console
          icon: di:minio

    - title: Monitoring
      links:
        - title: Warden
          subdomain: warden
          icon: https://raw.githubusercontent.com/projecthelena/warden/702a44724394d9841d86992b800d8df763023b9b/assets/favicon.svg
        - title: Dozzle
          subdomain: dozzle
          icon: di:dozzle
        - title: ZfDash
          subdomain: zfdash
          icon: https://raw.githubusercontent.com/ad4mts/zfdash/refs/heads/main/src/data/icons/zfs-gui.png
        - title: Scrutiny
          subdomain: scrutiny
          icon: di:scrutiny-light

  publicOnlyBookmarkGroups:
    - title: Proxy
      links:
        - title: FRP dashboard
          subdomain: frp
          icon: di:frp

  sharedWidgets:
    glance:
      - type: bookmarks

    stats:
      - type: calendar
        firstDayOfWeek: monday
      - type: weather
        location: Paris, France
        units: metric
        hourFormat: 24h
      - type: todo
      - type: hackerNews
        limit: 15
        collapseAfter: 10

  auth:
    secretKey: ref+envsubst://$GLANCE_AUTH_SECRET_KEY
    users:
      admin:
        password: ref+envsubst://$GLANCE_AUTH_USERS_ADMIN_PASSWORD
