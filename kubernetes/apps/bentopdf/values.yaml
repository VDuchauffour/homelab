---
resources:
  requests:
    cpu: 5m
    memory: 16Mi
  limits:
    cpu: '1'
    memory: 512Mi

ingress:
  enabled: true
  className: traefik
  url: bentopdf.ref+envsubst://$LOCAL_DOMAIN_NAME
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: mkcert-ca
  tls:
    enabled: true
    secretName: bentopdf-mkcert-tls
