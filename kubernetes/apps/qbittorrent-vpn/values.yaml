---
gluetun:
  enabled: true
  vpn:
    provider: protonvpn
    type: openvpn
    serverCountries: Switzerland
    openvpn:
      PROTONVPN_TIER: '2'
      SERVER_FEATURES: p2p
  credentials:
    create: false
    existingSecret: qbittorrent-vpn-proton
    usernameKey: username
    passwordKey: password
  settings:
    VPN_PORT_FORWARDING: 'on'
    FIREWALL_OUTBOUND_SUBNETS: 10.42.0.0/16,10.43.0.0/16,192.168.0.0/16
    STATUS_FILE: /gluetun-status.json
  persistence:
    enabled: true
    existingClaim: false
    storageClass: zfs-vm-pool-dynamic
    size: 100Mi
qbittorrent:
  persistence:
    config:
      enabled: true
      existingClaim: false
      storageClass: zfs-vm-pool-dynamic
      size: 2Gi
    downloads:
      enabled: true
      existingClaim: downloads
  env:
    - name: PUID
      value: 1000
    - name: PGID
      value: 1000
    - name: TZ
      value: Europe/Paris
resources:
  gluetun:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  qbittorrent:
    requests:
      cpu: 50m
      memory: 2Gi
    limits:
      memory: 4Gi

ingress:
  enabled: true
  className: traefik
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: mkcert-ca
  hosts:
    - host: qbittorrent.ref+envsubst://$LOCAL_DOMAIN_NAME
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - qbittorrent.ref+envsubst://$LOCAL_DOMAIN_NAME
      secretName: qbittorrent-mkcert-tls
