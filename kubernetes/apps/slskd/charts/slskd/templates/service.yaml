apiVersion: v1
kind: Service
metadata:
  name: {{ include "slskd.fullname" . }}
  labels:
    {{- include "slskd.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: 50300
      targetPort: soulseek
      protocol: TCP
      name: soulseek
  selector:
    {{- include "slskd.selectorLabels" . | nindent 4 }}
