apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "slskd.fullname" . }}
  labels:
    {{- include "slskd.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "slskd.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "slskd.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.persistence.music.enabled .Values.env.SLSKD_DOWNLOADS_DIR }}
      initContainers:
        - name: init-dirs
          image: busybox:latest
          command: ["sh", "-c", "mkdir -p {{ .Values.env.SLSKD_DOWNLOADS_DIR }}"]
          volumeMounts:
            - name: music
              mountPath: {{ .Values.persistence.music.mountPath }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5030
              protocol: TCP
            - name: soulseek
              containerPort: 50300
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 60
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if .Values.persistence.config.enabled }}
            - name: config
              mountPath: /app
            {{- end }}
            {{- if .Values.persistence.music.enabled }}
            - name: music
              mountPath: {{ .Values.persistence.music.mountPath }}
            {{- end }}
      volumes:
        {{- if .Values.persistence.config.enabled }}
        - name: config
          persistentVolumeClaim:
            claimName: {{ include "slskd.fullname" . }}-config
        {{- end }}
        {{- if .Values.persistence.music.enabled }}
        - name: music
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.music.existingClaim }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
