---
dashboard:
  persistence:
    storageClassName: zfs-vm-pool-dynamic

ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: mkcert-ca
  hosts:
    - host: helm-dashboard.ref+envsubst://$LOCAL_DOMAIN_NAME
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - helm-dashboard.ref+envsubst://$LOCAL_DOMAIN_NAME
      secretName: helm-dashboard-mkcert-tls
