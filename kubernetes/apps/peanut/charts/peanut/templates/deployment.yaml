apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "peanut.fullname" . }}
  labels:
    {{- include "peanut.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "peanut.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "peanut.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 1000
      {{- if .Values.influxdb.enabled }}
      initContainers:
        - name: wait-for-influxdb
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until wget -q -O /dev/null http://{{ include "peanut.fullname" . }}-influxdb:8086/health; do
                echo "Waiting for InfluxDB..."
                sleep 2
              done
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.config.WEB_PORT }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "peanut.fullname" . }}-config
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: config
              mountPath: /config
            {{- end }}
            - name: settings
              mountPath: /config/settings.yml
              subPath: settings.yml
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if .Values.nutUpsd.enabled }}
        - name: nut-upsd
          image: "{{ .Values.nutUpsd.image.repository }}:{{ .Values.nutUpsd.image.tag }}"
          imagePullPolicy: {{ .Values.nutUpsd.image.pullPolicy }}
          ports:
            - name: nut
              containerPort: 3493
              protocol: TCP
          env:
            - name: API_USER
              value: {{ .Values.nutUpsd.apiUser | quote }}
            - name: API_PASSWORD
              value: {{ .Values.nutUpsd.apiPassword | quote }}
            - name: DRIVER
              value: {{ .Values.nutUpsd.driver | quote }}
            - name: NAME
              value: {{ .Values.nutUpsd.upsName | quote }}
            - name: DESCRIPTION
              value: {{ .Values.nutUpsd.description | quote }}
            - name: SERVER
              value: {{ .Values.nutUpsd.server | quote }}
          securityContext:
            privileged: true
          volumeMounts:
            - name: usb
              mountPath: /dev/bus/usb
          {{- with .Values.nutUpsd.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: config
          persistentVolumeClaim:
            claimName: {{ include "peanut.fullname" . }}
        {{- end }}
        - name: settings
          configMap:
            name: {{ include "peanut.fullname" . }}-settings
        {{- if .Values.nutUpsd.enabled }}
        - name: usb
          hostPath:
            path: /dev/bus/usb
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
