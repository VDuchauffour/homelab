{{- if and .Values.influxdb.enabled .Values.influxdb.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "peanut.fullname" . }}-influxdb
  labels:
    {{- include "peanut.labels" . | nindent 4 }}
    app.kubernetes.io/component: influxdb
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.influxdb.persistence.storageClass }}
  storageClassName: {{ .Values.influxdb.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.influxdb.persistence.size }}
{{- end }}
