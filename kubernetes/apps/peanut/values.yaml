---
nutServers:
  - host: ref+envsubst://$SINGLE_NODE_NAME
    port: 3493

config:
  TZ: Europe/Paris
  # Auth disabled: API is consumed anonymously by the dynacat (Glance) custom-api
  # widget on the Cluster page. Service is ClusterIP-only; ingress is local-only
  # behind mkcert TLS. WEB_USERNAME/WEB_PASSWORD kept for easy re-enable.
  AUTH_DISABLED: true
  WEB_USERNAME: ref+scw:///homelab/peanut#/username
  WEB_PASSWORD: ref+scw:///homelab/peanut#/password

persistence:
  enabled: true
  storageClass: zfs-configs-clusters-k3s-dynamic
  size: 256Mi

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 512Mi

image:
  repository: brandawg93/peanut
  pullPolicy: IfNotPresent
  tag: latest

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: traefik
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: mkcert-ca
  hosts:
    - host: peanut.ref+envsubst://$LOCAL_DOMAIN_NAME
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - peanut.ref+envsubst://$LOCAL_DOMAIN_NAME
      secretName: peanut-mkcert-tls

influxdb:
  enabled: true
  persistence:
    storageClass: zfs-configs-clusters-k3s-dynamic
    size: 1Gi
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 512Mi
  init:
    username: admin
    password: ref+scw:///homelab/peanut-influxdb#/password
    org: homelab
    bucket: peanut
    token: ref+scw:///homelab/peanut-influxdb#/token
