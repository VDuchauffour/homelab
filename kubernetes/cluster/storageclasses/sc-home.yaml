---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: sc-home
  annotations:
    openebs.io/cas-type: local
    cas.openebs.io/config: |
      - name: StorageType
        value: "hostpath"
      - name: BasePath
        value: "/home/k"
allowVolumeExpansion: true
provisioner: openebs.io/local
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
