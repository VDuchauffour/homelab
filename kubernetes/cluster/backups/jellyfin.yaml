---
apiVersion: v1
kind: Secret
metadata:
  name: restic-rustfs-credentials
  namespace: media-center
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: ref+envsubst://$RUSTFS_ROOT_USER
  AWS_SECRET_ACCESS_KEY: ref+envsubst://$RUSTFS_ROOT_PASSWORD
  RESTIC_PASSWORD: ref+envsubst://$RESTIC_PASSWORD
  RESTIC_REPOSITORY: s3:http://rustfs-svc.rustfs.svc.cluster.local:9000/restic-backups/jellyfin
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: restic-backup
  namespace: media-center
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: restic-backup
  namespace: media-center
rules:
  - apiGroups:
      - apps
    resources:
      - deployments/scale
    verbs:
      - get
      - patch
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - list
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - get
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: restic-backup
  namespace: media-center
subjects:
  - kind: ServiceAccount
    name: restic-backup
roleRef:
  kind: Role
  name: restic-backup
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: restic-init-jellyfin
  namespace: media-center
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: restic
          image: restic/restic:0.17.3
          command:
            - sh
            - -c
            - |
              restic snapshots 2>/dev/null && echo "Repository already initialized" || restic init
          envFrom:
            - secretRef:
                name: restic-rustfs-credentials
      nodeSelector:
        kubernetes.io/hostname: ref+envsubst://$SINGLE_NODE_NAME
  backoffLimit: 1
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic-backup-jellyfin
  namespace: media-center
spec:
  schedule: 0 3 * * 0
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: restic-backup
          restartPolicy: Never
          containers:
            - name: orchestrator
              image: alpine/curl:latest
              env:
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
              command:
                - sh
                - -c
                - |
                  apk add --no-cache jq > /dev/null 2>&1

                  APISERVER=https://kubernetes.default.svc
                  TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                  CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  NAMESPACE=media-center

                  api() {
                    curl -s "$APISERVER$1" \
                      -H "Authorization: Bearer $TOKEN" \
                      --cacert "$CACERT" \
                      "${@:2}"
                  }

                  scale_jellyfin() {
                    api "/apis/apps/v1/namespaces/$NAMESPACE/deployments/jellyfin/scale" \
                      -X PATCH \
                      -H "Content-Type: application/strategic-merge-patch+json" \
                      -d "{\"spec\":{\"replicas\":$1}}" > /dev/null
                  }

                  trap 'echo "Scaling jellyfin back up..."; scale_jellyfin 1' EXIT

                  echo "Scaling down jellyfin..."
                  scale_jellyfin 0

                  echo "Waiting for jellyfin to terminate..."
                  for i in $(seq 1 60); do
                    REPLICAS=$(api "/apis/apps/v1/namespaces/$NAMESPACE/deployments/jellyfin/scale" | jq '.status.replicas // 0')
                    [ "$REPLICAS" -eq 0 ] && break
                    sleep 5
                  done
                  sleep 5

                  JOB_NAME="restic-jellyfin-$(date +%s)"
                  echo "Creating backup job $JOB_NAME..."

                  api "/apis/batch/v1/namespaces/$NAMESPACE/jobs" \
                    -X POST \
                    -H "Content-Type: application/json" \
                    -d "{
                      \"apiVersion\": \"batch/v1\",
                      \"kind\": \"Job\",
                      \"metadata\": {
                        \"name\": \"$JOB_NAME\",
                        \"namespace\": \"$NAMESPACE\"
                      },
                      \"spec\": {
                        \"backoffLimit\": 1,
                        \"template\": {
                          \"spec\": {
                            \"restartPolicy\": \"Never\",
                            \"nodeSelector\": {
                              \"kubernetes.io/hostname\": \"$NODE_NAME\"
                            },
                            \"containers\": [{
                              \"name\": \"restic\",
                              \"image\": \"restic/restic:0.17.3\",
                              \"command\": [\"sh\", \"-c\", \"set -e; echo Starting backup...; restic backup /data --tag jellyfin --tag config --host jellyfin --exclude='*.log' --exclude='transcodes/**' --verbose; echo Pruning...; restic forget --keep-weekly 3 --prune; echo Done.\"],
                              \"envFrom\": [{\"secretRef\": {\"name\": \"restic-rustfs-credentials\"}}],
                              \"volumeMounts\": [{\"name\": \"jellyfin-config\", \"mountPath\": \"/data\", \"readOnly\": true}]
                            }],
                            \"volumes\": [{
                              \"name\": \"jellyfin-config\",
                              \"persistentVolumeClaim\": {\"claimName\": \"jellyfin-config\"}
                            }]
                          }
                        }
                      }
                    }" > /dev/null

                  echo "Waiting for backup job to complete..."
                  for i in $(seq 1 120); do
                    STATUS=$(api "/apis/batch/v1/namespaces/$NAMESPACE/jobs/$JOB_NAME" | jq -r '.status.conditions[]?.type // empty')
                    case "$STATUS" in
                      *Complete*)
                        echo "Backup job completed successfully."
                        api "/apis/batch/v1/namespaces/$NAMESPACE/jobs/$JOB_NAME?propagationPolicy=Background" -X DELETE > /dev/null
                        exit 0
                        ;;
                      *Failed*)
                        echo "ERROR: Backup job failed."
                        api "/apis/batch/v1/namespaces/$NAMESPACE/jobs/$JOB_NAME?propagationPolicy=Background" -X DELETE > /dev/null
                        exit 1
                        ;;
                    esac
                    sleep 5
                  done
                  echo "ERROR: Backup job timed out."
                  api "/apis/batch/v1/namespaces/$NAMESPACE/jobs/$JOB_NAME?propagationPolicy=Background" -X DELETE > /dev/null
                  exit 1
          nodeSelector:
            kubernetes.io/hostname: ref+envsubst://$SINGLE_NODE_NAME
      backoffLimit: 0
