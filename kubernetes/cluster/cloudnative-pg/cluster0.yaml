---
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-clusters
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-cluster0
  namespace: cnpg-clusters
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: enabled
spec:
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18-1.1.0
  instances: 1
  storage:
    size: 10Gi
    storageClass: zfs-vm-pool-dynamic
  bootstrap:
    initdb:
      database: noop
      owner: noop
      secret:
        name: noop-cnpg-credentials
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: cnpg-minio-store
  managed:
    roles:
      - name: admin
        ensure: present
        comment: admin
        login: true
        superuser: true
        inRoles:
          - pg_monitor
          - pg_signal_backend
        passwordSecret:
          name: admin-cnpg-credentials
      - name: kan
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: kan-cnpg-credentials
      - name: n8n
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: n8n-cnpg-credentials
      - name: linkwarden
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: linkwarden-cnpg-credentials
      - name: linkding
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: linkding-cnpg-credentials
      - name: passbolt
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: passbolt-cnpg-credentials
      - name: immich
        ensure: present
        login: true
        superuser: true
        passwordSecret:
          name: immich-cnpg-credentials
      - name: warden
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: warden-cnpg-credentials
  postgresql:
    shared_preload_libraries:
      - vchord.so
    parameters:
      shared_buffers: 256MB
      max_connections: '100'
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: '1'
---
apiVersion: v1
kind: Secret
metadata:
  name: noop-cnpg-credentials
  namespace: cnpg-clusters
  labels:
    cnpg.io/reload: 'true'
type: kubernetes.io/basic-auth
stringData:
  username: noop
  password: ref+envsubst://$CLOUDNATIVE_PG_NOOP_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: admin-cnpg-credentials
  namespace: cnpg-clusters
  labels:
    cnpg.io/reload: 'true'
type: kubernetes.io/basic-auth
stringData:
  username: admin
  password: ref+envsubst://$CLOUDNATIVE_PG_ADMIN_PASSWORD
