---
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-clusters
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-cluster0
  namespace: cnpg-clusters
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: enabled
spec:
  imageName: homelab/cnpg-vectorchord-timescaledb:18
  imagePullPolicy: IfNotPresent
  instances: 1
  storage:
    size: 10Gi
    storageClass: zfs-configs-clusters-k3s-dynamic
  bootstrap:
    initdb:
      database: noop
      owner: noop
      secret:
        name: noop-cnpg-credentials
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: cnpg-rustfs-store
  managed:
    roles:
      - name: admin
        ensure: present
        comment: admin
        login: true
        superuser: true
        inRoles:
          - pg_monitor
          - pg_signal_backend
        passwordSecret:
          name: admin-cnpg-credentials
      - name: kan
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: kan-cnpg-credentials
      - name: n8n
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: n8n-cnpg-credentials
      - name: linkwarden
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: linkwarden-cnpg-credentials
      - name: linkding
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: linkding-cnpg-credentials
      - name: immich
        ensure: present
        login: true
        superuser: true
        passwordSecret:
          name: immich-cnpg-credentials
      - name: warden
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: warden-cnpg-credentials
      - name: memos
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: memos-cnpg-credentials
      - name: grafana
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: grafana-cnpg-credentials
      - name: wakapi
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: wakapi-cnpg-credentials
      - name: mlflow
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: mlflow-cnpg-credentials
      - name: nextcloud
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: nextcloud-cnpg-credentials
      - name: tracearr
        ensure: present
        login: true
        superuser: true
        passwordSecret:
          name: tracearr-cnpg-credentials
      - name: gotify
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: gotify-cnpg-credentials

  postgresql:
    shared_preload_libraries:
      - vchord.so
      - timescaledb
    parameters:
      shared_buffers: 256MB
      max_connections: '100'
      max_locks_per_transaction: '4096'
      timescaledb.telemetry_level: 'off'
      timescaledb.max_tuples_decompressed_per_dml_transaction: '0'
  monitoring:
    enablePodMonitor: true
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: '1'
---
apiVersion: v1
kind: Secret
metadata:
  name: noop-cnpg-credentials
  namespace: cnpg-clusters
  labels:
    cnpg.io/reload: 'true'
type: kubernetes.io/basic-auth
stringData:
  username: noop
  password: ref+scw:///homelab/cnpg#/noop-password
---
apiVersion: v1
kind: Secret
metadata:
  name: admin-cnpg-credentials
  namespace: cnpg-clusters
  labels:
    cnpg.io/reload: 'true'
type: kubernetes.io/basic-auth
stringData:
  username: admin
  password: ref+scw:///homelab/cnpg#/admin-password
