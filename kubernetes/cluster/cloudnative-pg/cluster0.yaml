---
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-clusters
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-cnpg
spec:
  storageClassName: zfs-vm-pool-cnpg
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  local:
    path: /vm-pool/cnpg
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - joi
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-cluster0
  namespace: cnpg-clusters
spec:
  instances: 1
  storage:
    size: 5Gi
    storageClass: zfs-vm-pool-cnpg
  bootstrap:
    initdb:  # init an empty cluster with a noop database
      database: noop
      owner: noop
      secret:
        name: noop-cnpg-credentials
  managed:
    roles:
      - name: admin
        ensure: present
        comment: admin
        login: true
        superuser: true
        inRoles:
          - pg_monitor
          - pg_signal_backend
        passwordSecret:
          name: admin-cnpg-credentials
      - name: kan
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: kan-cnpg-credentials
      - name: n8n
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: n8n-cnpg-credentials
      - name: linkwarden
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: linkwarden-cnpg-credentials
      - name: linkding
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: linkding-cnpg-credentials
  postgresql:
    parameters:
      shared_buffers: 256MB
      max_connections: '100'
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: '1'
---
apiVersion: v1
kind: Secret
metadata:
  name: noop-cnpg-credentials
  namespace: cnpg-clusters
  labels:
    cnpg.io/reload: 'true'
type: kubernetes.io/basic-auth
stringData:
  username: noop
  password: ref+envsubst://$CLOUDNATIVE_PG_NOOP_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: admin-cnpg-credentials
  namespace: cnpg-clusters
  labels:
    cnpg.io/reload: 'true'
type: kubernetes.io/basic-auth
stringData:
  username: admin
  password: ref+envsubst://$CLOUDNATIVE_PG_ADMIN_PASSWORD
