---
# Routes openchamber.home.arpa to the host-installed OpenChamber web UI (port 14098)
apiVersion: v1
kind: Service
metadata:
  name: openchamber-host
spec:
  ports:
    - port: 14098
      targetPort: 14098
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: openchamber-host
subsets:
  - addresses:
      - ip: ref+envsubst://$SINGLE_NODE_IP
    ports:
      - port: 14098
        protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openchamber
  annotations:
    cert-manager.io/cluster-issuer: mkcert-ca
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - openchamber.ref+envsubst://$LOCAL_DOMAIN_NAME
      secretName: openchamber-mkcert-tls
  rules:
    - host: openchamber.ref+envsubst://$LOCAL_DOMAIN_NAME
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openchamber-host
                port:
                  number: 14098
