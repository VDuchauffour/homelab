---
replicaCount: 1

image:
  tag: 1.0.0-alpha.83

mode:
  standalone:
    enabled: true
  distributed:
    enabled: false

secret:
  existingSecret: rustfs-credentials

storageclass:
  name: zfs-configs-clusters-k3s-dynamic
  dataStorageSize: 50Gi
  logStorageSize: 1Gi

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi

service:
  type: ClusterIP
  endpoint:
    port: 9000
  console:
    port: 9001

ingress:
  enabled: true
  className: ''
  customAnnotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: mkcert-ca
  hosts:
    - host: rustfs-console.ref+envsubst://$LOCAL_DOMAIN_NAME
      paths:
        - path: /
          pathType: Prefix
  tls:
    enabled: true
    certManager:
      enabled: true
