---
repositories:
  - name: minio
    url: https://charts.min.io
releases:
  - name: minio
    namespace: minio
    createNamespace: true
    chart: minio/minio
    version: 5.4.0
    values:
      - values.yaml
    hooks:
      - events:
          - presync
        showlogs: true
        command: /bin/sh
        args:
          - -c
          - vals eval -f manifests/secret.yaml | kubectl apply -f -
      - events:
          - postuninstall
        showlogs: true
        command: /bin/sh
        args:
          - -c
          - vals eval -f manifests/secret.yaml | kubectl delete -f -
