---
mode: standalone

existingSecret: minio-credentials

persistence:
  enabled: true
  storageClass: zfs-vm-pool-dynamic
  size: 50Gi

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi

buckets:
  - name: cnpg-backups
    policy: none
    purge: false

consoleIngress:
  enabled: true
  ingressClassName: traefik
  annotations:
    cert-manager.io/cluster-issuer: mkcert-ca
  hosts:
    - minio-console.ref+envsubst://$LOCAL_DOMAIN_NAME
  tls:
    - secretName: minio-console-tls
      hosts:
        - minio-console.ref+envsubst://$LOCAL_DOMAIN_NAME

ingress:
  enabled: false
