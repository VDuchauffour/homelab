---
redisDependencyEnabled: true
mariadbDependencyEnabled: false
postgresqlDependencyEnabled: false

replicaCount: 1

app:
  database:
    kind: postgresql
  cache:
    redis:
      enabled: true
      sentinelProxy:
        enabled: false
jwtCreateKeysForced: true

passboltEnv:
  plain:
    APP_FULL_BASE_URL: https://passbolt.ref+envsubst://$LOCAL_DOMAIN_NAME
    PASSBOLT_SSL_FORCE: 'false'
    PASSBOLT_REGISTRATION_PUBLIC: 'true'
    PASSBOLT_PLUGINS_JWT_AUTHENTICATION_ENABLED: 'true'
    PASSBOLT_KEY_EMAIL: ref+envsubst://$EMAIL_ADDRESS
    DEBUG: 'false'
    DATASOURCES_DEFAULT_HOST: cnpg-cluster0-rw.cnpg-clusters.svc.cluster.local
    DATASOURCES_DEFAULT_PORT: '5432'
    CACHE_DEFAULT_HOST: passbolt-redis-master
    CACHE_CAKECORE_HOST: passbolt-redis-master
    CACHE_CAKEMODEL_HOST: passbolt-redis-master
  secret:
    DATASOURCES_DEFAULT_USERNAME: passbolt
    DATASOURCES_DEFAULT_PASSWORD: ref+passbolt://ac982d03-b97f-43ed-80ed-a2d36d30d2ed#/custom_fields/CNPG_PASSWORD
    DATASOURCES_DEFAULT_DATABASE: passbolt
    CACHE_DEFAULT_PASSWORD: ref+passbolt://ac982d03-b97f-43ed-80ed-a2d36d30d2ed#/custom_fields/REDIS_PASSWORD
    CACHE_CAKECORE_PASSWORD: ref+passbolt://ac982d03-b97f-43ed-80ed-a2d36d30d2ed#/custom_fields/REDIS_PASSWORD
    CACHE_CAKEMODEL_PASSWORD: ref+passbolt://ac982d03-b97f-43ed-80ed-a2d36d30d2ed#/custom_fields/REDIS_PASSWORD

redis:
  auth:
    password: ref+passbolt://ac982d03-b97f-43ed-80ed-a2d36d30d2ed#/custom_fields/REDIS_PASSWORD
  sentinel:
    enabled: false

cronJobEmail:
  enabled: false

# Override probes to use correct hostname
livenessProbe:
  httpGet:
    port: http
    scheme: HTTP
    path: /healthcheck/status.json
    httpHeaders:
      - name: Host
        value: passbolt.ref+envsubst://$LOCAL_DOMAIN_NAME
  initialDelaySeconds: 20
  periodSeconds: 10

readinessProbe:
  httpGet:
    port: http
    scheme: HTTP
    path: /healthcheck/status.json
    httpHeaders:
      - name: Host
        value: passbolt.ref+envsubst://$LOCAL_DOMAIN_NAME
  initialDelaySeconds: 5
  periodSeconds: 10

ingress:
  enabled: true
  className: traefik
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: mkcert-ca
  hosts:
    - host: passbolt.ref+envsubst://$LOCAL_DOMAIN_NAME
      paths:
        - path: /
          pathType: ImplementationSpecific
          port: http
  tls:
    - existingSecret: passbolt-mkcert-tls
      hosts:
        - passbolt.ref+envsubst://$LOCAL_DOMAIN_NAME
