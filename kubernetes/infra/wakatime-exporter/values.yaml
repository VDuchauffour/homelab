---
image:
  repository: macropower/wakatime-exporter
  tag: 0.1.0

wakatime:
  apiKey: ref+envsubst://$WAKATIME_API_KEY
  scrapeUri: http://wakapi.wakapi.svc.cluster.local/api/compat/wakatime/v1
  user: current
  timeout: 5s
  sslVerify: 'false'
  collectors:
    allTime: 'true'
    goal: 'false'
    leader: 'false'
    summary: 'true'

serviceMonitor:
  enabled: true
  interval: 60s
  scrapeTimeout: 10s
  release: monitoring

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
