image:
  repository: macropower/wakatime-exporter
  tag: "0.1.0"
  pullPolicy: IfNotPresent

wakatime:
  apiKey: ""
  scrapeUri: "https://wakatime.com/api/v1"
  user: "current"
  timeout: "5s"
  sslVerify: "true"
  collectors:
    allTime: "true"
    goal: "true"
    leader: "true"
    summary: "true"

service:
  port: 9212

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  release: ""

resources: {}
