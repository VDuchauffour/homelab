{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "wakatime-exporter.fullname" . }}
  labels:
    {{- include "wakatime-exporter.labels" . | nindent 4 }}
    release: {{ .Values.serviceMonitor.release | default .Release.Name }}
spec:
  selector:
    matchLabels:
      {{- include "wakatime-exporter.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      path: /metrics
{{- end }}
